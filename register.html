<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuscleUp - Register</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .register-card {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .register-card h2 {
            text-align: center;
            margin-bottom: 5px;
            color: #00ff66;
        }
        .register-card p {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #242424;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: #00ff66;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #00ff66;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .auth-link a {
            color: #00ff66;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h1 style="text-align: center; font-size: 28px; margin-bottom: 0;">MUSCLE<span>UP</span></h1>
        <h2>Create Account</h2>
        <p>Buat akun dan mulai perjalanan fitness kamu.</p>

        <!-- Form Register -->
        <form id="registerForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="regName" class="form-control" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" class="form-control" placeholder="Masukkan email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" class="form-control" placeholder="Buat password" required>
            </div>

            <div class="form-group">
                <label>Konfirmasi Password</label>
                <input type="password" id="regConfirmPassword" class="form-control" placeholder="Ulangi password" required>
            </div>

            <button type="submit" class="btn-submit">CREATE ACCOUNT</button>
        </form>

        <div class="auth-link">
            Sudah punya akun? <a href="login.html">Login sekarang</a>
        </div>
    </div>

    <!-- Script JavaScript untuk Menyimpan Nama & Redirect -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                alert('Password dan Konfirmasi Password tidak sama!');
                return;
            }

            const formattedName = name.charAt(0).toUpperCase() + name.slice(1);
            localStorage.setItem('userName', formattedName);

            // Inisialisasi data user baru agar mulai dari 0 bersih
            let userKey = "user_" + formattedName.toLowerCase();
            localStorage.setItem(userKey + "_totalSesi", "0");
            localStorage.setItem(userKey + "_totalKalori", "0");
            localStorage.setItem(userKey + "_totalMenit", "0");
            localStorage.setItem(userKey + "_workoutHistory", JSON.stringify([]));

            alert('Registrasi Berhasil! Selamat datang di MuscleUp, ' + formattedName + ' 🎉');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
